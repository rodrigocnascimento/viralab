name: CD - Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - "packages/auth/**"
      - "packages/shared/**"
      - ".github/workflows/cd-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viralab-web-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare types
        run: pnpm --filter @viralab/web exec wrangler types

      - name: Lint web
        run: pnpm --filter @viralab/web lint

      - name: Typecheck web
        run: pnpm --filter @viralab/web typecheck

      - name: Test web
        run: pnpm --filter @viralab/web test

      - name: Build web
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: "0.1"
          VITE_SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE: "1"
          SENTRY_ORG: viralab
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm --filter @viralab/web build

      - name: Smoke test built web runtime
        run: bash apps/web/scripts/smoke-runtime.sh

      - name: Deploy landing to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @viralab/web exec wrangler deploy


      - name: Smoke test production web runtime
        run: bash apps/web/scripts/smoke-runtime.sh https://viralab.space

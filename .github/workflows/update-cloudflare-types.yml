name: Update Cloudflare types

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Cloudflare types
        run: pnpm --filter @viralab/web exec wrangler types

      - name: Commit generated types
        run: |
          if git diff --quiet -- apps/web/worker-configuration.d.ts; then
            echo "Cloudflare types already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/worker-configuration.d.ts
          git commit -m "chore(web): regenerate Cloudflare Worker types"
          git push origin HEAD:${GITHUB_REF_NAME}

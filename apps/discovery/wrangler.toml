name = "viralab-discovery"
main = "src/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[queues.consumers]]
queue = "viralab-discovery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "viralab-discovery-dlq"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3b8b5380c72b4d49af5828d60a08e969"
localConnectionString = "postgresql://viralab:viralab@localhost:5432/viralab"

[vars]
YOUTUBE_MAX_RESULTS = "25"

[secrets]
required = ["YOUTUBE_API_KEY"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

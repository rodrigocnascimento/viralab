services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viralab
      POSTGRES_PASSWORD: viralab
      POSTGRES_DB: viralab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralab -d viralab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

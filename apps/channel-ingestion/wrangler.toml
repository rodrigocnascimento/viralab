name = "viralab-channel-ingestion"
main = "src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[queues.consumers]]
queue = "viralab-channel-ingestion"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "viralab-channel-ingestion-dlq"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3b8b5380c72b4d49af5828d60a08e969"
localConnectionString = "postgresql://viralab:viralab@localhost:5432/viralab"

[secrets]
required = ["YOUTUBE_API_KEY"]

[observability.logs]
enabled = true
head_sampling_rate = 0.50
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.25
persist = true

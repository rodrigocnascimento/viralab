name = "viralab-api"
main = "src/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[queues.producers]]
binding = "DISCOVERY_QUEUE"
queue = "viralab-discovery"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3b8b5380c72b4d49af5828d60a08e969"
localConnectionString = "postgresql://viralab:viralab@localhost:5432/viralab"

[vars]
# Comma-separated exact origins allowed by the API.
CORS_ALLOWED_ORIGINS = "http://localhost:5173,https://viralab.space"
SUPABASE_URL = "https://msdcsrxyxhdszmnqksbp.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5EYKMC3b5WdnKAgZz5g4sw_XQxbOKRf"

[observability.logs]
enabled = true
head_sampling_rate = 0.25
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.10
persist = true

[[ratelimits]]
name = "WAITLIST_IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WAITLIST_EMAIL_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "ANONYMOUS_EXPLORER_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

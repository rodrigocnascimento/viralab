name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare types
        if: hashFiles('apps/web/worker-configuration.d.ts') != ''
        run: pnpm --filter @viralab/web exec wrangler types --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore

      - name: Determine test/build scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
            changed="$(git diff --name-only "$base" HEAD)"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
          fi
          echo "$changed"
          if grep -Eq '^package.json$|^pnpm-lock.yaml$|^pnpm-workspace.yaml$|^tsconfig.base.json$|^eslint.config|^packages/' <<<"$changed"; then
            echo "global=true" >> "$GITHUB_OUTPUT"
          else
            echo "global=false" >> "$GITHUB_OUTPUT"
          fi
          apps="$(sed -n 's#^apps/\([^/]*\)/.*#\1#p' <<<"$changed" | sort -u | paste -sd, -)"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - name: Test shared changes
        if: steps.scope.outputs.global == 'true'
        run: pnpm test

      - name: Build shared changes
        if: steps.scope.outputs.global == 'true'
        run: pnpm build

      - name: Test affected apps
        if: steps.scope.outputs.global != 'true' && steps.scope.outputs.apps != ''
        shell: bash
        run: |
          IFS=',' read -ra apps <<< "${{ steps.scope.outputs.apps }}"
          for app in "${apps[@]}"; do
            pnpm --filter "./apps/$app" test
          done

      - name: Build affected apps
        if: steps.scope.outputs.global != 'true' && steps.scope.outputs.apps != ''
        shell: bash
        run: |
          IFS=',' read -ra apps <<< "${{ steps.scope.outputs.apps }}"
          for app in "${apps[@]}"; do
            pnpm --filter "./apps/$app" build
          done


      - name: Smoke test web runtime
        if: steps.scope.outputs.global == 'true' || contains(steps.scope.outputs.apps, 'web')
        run: bash apps/web/scripts/smoke-runtime.sh
